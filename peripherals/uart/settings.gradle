pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'uart'

// ── Local SDK copy (downloaded by Orbit Studio) ────────────────────────────────
include ':sdk'
project(':sdk').projectDir = file('orbit-os-sdk-java')

// ── Apps ──────────────────────────────────────────────────────────────────────
// Auto-include every module under apps/ (any directory containing a build.gradle).
def appsDir = file('apps')
if (appsDir.isDirectory()) {
    appsDir.eachDirRecurse { d ->
        if (new File(d, 'build.gradle').isFile()) {
            include ':' + rootDir.toPath().relativize(d.toPath()).toString().replace(File.separator, ':')
        }
    }
}
